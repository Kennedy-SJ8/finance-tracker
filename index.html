<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinanceTracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { background-color: #0B1118; }
    :root {
      --bg-primary: #0B1118;
      --bg-card: #16202C;
      --accent-emerald: #00E699;
      --accent-red: #FF5252;
      --text-primary: #FFFFFF;
      --text-secondary: #8A99AD;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card { background-color: var(--bg-card); border-radius: 16px; }
    .text-emerald { color: var(--accent-emerald); }
    .text-red-custom { color: var(--accent-red); }
    .text-secondary { color: var(--text-secondary); }
    .bg-emerald { background-color: var(--accent-emerald); }
    .bg-card { background-color: var(--bg-card); }
    .modal-overlay {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }
    .progress-bar {
      height: 6px;
      border-radius: 3px;
      background: #1e293b;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .btn-primary {
      background-color: var(--accent-emerald);
      color: #0B1118;
      font-weight: 600;
      border-radius: 12px;
      padding: 14px 24px;
      transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.8; }
    .input-field {
      background-color: #1e293b;
      border: 1px solid #2d3a4a;
      border-radius: 12px;
      padding: 14px 16px;
      color: white;
      font-size: 16px;
      width: 100%;
      outline: none;
    }
    .input-field:focus { border-color: var(--accent-emerald); }
    .category-chip {
      background-color: #1e293b;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .category-chip.active {
      background-color: rgba(0, 230, 153, 0.15);
      color: var(--accent-emerald);
      border-color: var(--accent-emerald);
    }
    .transaction-item {
      display: flex;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #1e293b;
    }
    .transaction-item:last-child { border-bottom: none; }
    .category-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .fab-button {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--accent-emerald);
      color: #0B1118;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 20px rgba(0, 230, 153, 0.4);
      z-index: 50;
      transition: transform 0.2s;
    }
    .fab-button:active { transform: scale(0.95); }
    .stat-card {
      background-color: var(--bg-card);
      border-radius: 14px;
      padding: 16px;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .slide-up { animation: slideUp 0.3s ease-out; }
    .spinner {
      border: 3px solid #1e293b;
      border-top: 3px solid var(--accent-emerald);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 500;
      z-index: 100;
      animation: slideDown 0.3s ease-out;
    }
    @keyframes slideDown {
      from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    .toast-success { background-color: rgba(0, 230, 153, 0.9); color: #0B1118; }
    .toast-error { background-color: rgba(255, 82, 82, 0.9); color: white; }
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body class="text-white min-h-screen pb-24">

  <!-- HEADER / BALANCE -->
  <header class="px-5 pt-12 pb-6">
    <div class="flex items-center justify-between mb-6">
      <div>
        <p class="text-secondary text-sm">Balance Disponible</p>
        <h1 id="balance" class="text-4xl font-bold text-emerald">$0.00</h1>
      </div>
      <div class="w-10 h-10 rounded-full bg-card flex items-center justify-center">
        <i class="fas fa-chart-pie text-secondary"></i>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="stat-card">
        <div class="flex items-center gap-2 mb-1">
          <div class="w-2 h-2 rounded-full bg-emerald"></div>
          <span class="text-secondary text-xs">Ingresos</span>
        </div>
        <p id="ingresos" class="text-lg font-semibold text-emerald">$0.00</p>
      </div>
      <div class="stat-card">
        <div class="flex items-center gap-2 mb-1">
          <div class="w-2 h-2 rounded-full bg-red-custom"></div>
          <span class="text-secondary text-xs">Gastos</span>
        </div>
        <p id="gastos" class="text-lg font-semibold text-red-custom">$0.00</p>
      </div>
    </div>
  </header>

  <!-- PRESUPUESTOS -->
  <section class="px-5 mb-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold">Presupuestos</h2>
      <button onclick="openPresupuestoModal()" class="text-secondary text-sm">
        <i class="fas fa-plus"></i>
      </button>
    </div>
    <div id="presupuestos-container" class="space-y-3">
      <div class="card p-4">
        <div class="spinner"></div>
      </div>
    </div>
  </section>

  <!-- MOVIMIENTOS RECIENTES -->
  <section class="px-5">
    <h2 class="text-lg font-semibold mb-4">Movimientos Recientes</h2>
    <div id="movimientos-container" class="card p-4">
      <div class="spinner"></div>
    </div>
  </section>

  <!-- FAB - NUEVO GASTO -->
  <button onclick="openGastoModal()" class="fab-button">
    <i class="fas fa-plus"></i>
  </button>

  <!-- MODAL GASTO RAPIDO -->
  <div id="gasto-modal" class="fixed inset-0 modal-overlay z-50 hidden items-end justify-center">
    <div class="bg-[#16202C] w-full max-w-lg rounded-t-3xl p-6 slide-up">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-bold">Gasto Rapido</h3>
        <button onclick="closeGastoModal()" class="text-secondary text-2xl">&times;</button>
      </div>

      <form id="gasto-form" onsubmit="submitGasto(event)">
        <div class="mb-4">
          <label class="text-secondary text-sm mb-2 block">Monto</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-emerald">$</span>
            <input type="number" step="0.01" min="0" id="gasto-monto"
              class="input-field pl-10 text-2xl font-bold" placeholder="0.00" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="text-secondary text-sm mb-2 block">Concepto</label>
          <input type="text" id="gasto-concepto" class="input-field"
            placeholder="Ej: Almuerzo, Uber, Netflix..." required>
        </div>

        <div class="mb-6">
          <label class="text-secondary text-sm mb-3 block">Categoria</label>
          <div id="categorias-chips" class="flex flex-wrap gap-2">
            <span class="category-chip active" data-categoria="alimentacion">Alimentacion</span>
            <span class="category-chip" data-categoria="transporte">Transporte</span>
            <span class="category-chip" data-categoria="entretenimiento">Entretenimiento</span>
            <span class="category-chip" data-categoria="salud">Salud</span>
            <span class="category-chip" data-categoria="educacion">Educacion</span>
            <span class="category-chip" data-categoria="hogar">Hogar</span>
            <span class="category-chip" data-categoria="ropa">Ropa</span>
            <span class="category-chip" data-categoria="tecnologia">Tecnologia</span>
            <span class="category-chip" data-categoria="gasto_hormiga">Gasto hormiga</span>
            <span class="category-chip" data-categoria="otro">Otro</span>
          </div>
        </div>

        <div id="presupuesto-bar-container" class="mb-6 hidden">
          <div class="flex items-center justify-between mb-2">
            <span class="text-secondary text-sm">Presupuesto restante</span>
            <span id="presupuesto-restante-text" class="text-sm font-semibold text-emerald">$0</span>
          </div>
          <div class="progress-bar">
            <div id="presupuesto-bar" class="progress-fill bg-emerald" style="width: 100%"></div>
          </div>
        </div>

        <button type="submit" id="btn-submit-gasto" class="btn-primary w-full text-lg">
          Registrar Gasto
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL INGRESO -->
  <div id="ingreso-modal" class="fixed inset-0 modal-overlay z-50 hidden items-end justify-center">
    <div class="bg-[#16202C] w-full max-w-lg rounded-t-3xl p-6 slide-up">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-bold">Ingreso Inteligente</h3>
        <button onclick="closeIngresoModal()" class="text-secondary text-2xl">&times;</button>
      </div>

      <form id="ingreso-form" onsubmit="submitIngreso(event)">
        <div class="mb-4">
          <label class="text-secondary text-sm mb-2 block">Monto</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-emerald">$</span>
            <input type="number" step="0.01" min="0" id="ingreso-monto"
              class="input-field pl-10 text-2xl font-bold" placeholder="0.00" required>
          </div>
        </div>

        <div class="mb-6">
          <label class="text-secondary text-sm mb-2 block">Fuente</label>
          <input type="text" id="ingreso-fuente" class="input-field"
            placeholder="Ej: Salario, Freelance, Venta..." required>
        </div>

        <button type="submit" id="btn-submit-ingreso" class="btn-primary w-full text-lg">
          Registrar Ingreso
        </button>
      </form>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#0f1722] border-t border-[#1e293b] px-6 py-4 flex items-center justify-around z-40">
    <button class="flex flex-col items-center gap-1 text-emerald">
      <i class="fas fa-home text-xl"></i>
      <span class="text-xs">Inicio</span>
    </button>
    <button onclick="openIngresoModal()" class="flex flex-col items-center gap-1 text-secondary">
      <i class="fas fa-arrow-down text-xl"></i>
      <span class="text-xs">Ingreso</span>
    </button>
    <button onclick="openGastoModal()" class="flex flex-col items-center gap-1 text-secondary">
      <i class="fas fa-arrow-up text-xl"></i>
      <span class="text-xs">Gasto</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-secondary">
      <i class="fas fa-chart-bar text-xl"></i>
      <span class="text-xs">Stats</span>
    </button>
  </nav>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw0F0y9Mbr0IPttRND2yqyrBe-G7nQwvFQmdUQVc177f2CWQZDZ3CXrs3zI9IqzNs2R/exec';

    const CATEGORIAS = {
      alimentacion: { emoji: '🍔', color: '#F59E0B', nombre: 'Alimentación' },
      transporte: { emoji: '🚗', color: '#3B82F6', nombre: 'Transporte' },
      entretenimiento: { emoji: '🎮', color: '#8B5CF6', nombre: 'Entretenimiento' },
      salud: { emoji: '💊', color: '#EF4444', nombre: 'Salud' },
      educacion: { emoji: '📚', color: '#06B6D4', nombre: 'Educación' },
      hogar: { emoji: '🏠', color: '#10B981', nombre: 'Hogar' },
      ropa: { emoji: '👕', color: '#EC4899', nombre: 'Ropa' },
      tecnologia: { emoji: '📱', color: '#6366F1', nombre: 'Tecnología' },
      gasto_hormiga: { emoji: '🐜', color: '#8A99AD', nombre: 'Gasto hormiga' },
      otro: { emoji: '📦', color: '#64748B', nombre: 'Otro' },
      ingreso: { emoji: '💰', color: '#00E699', nombre: 'Ingreso' }
    };

    let categoriaSeleccionada = 'alimentacion';
    let presupuestos = [];

    document.addEventListener('DOMContentLoaded', () => {
      cargarDashboard();
      setupCategoryChips();
    });

    function setupCategoryChips() {
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          categoriaSeleccionada = chip.dataset.categoria;
          actualizarBarraPresupuesto();
        });
      });
    }

    async function cargarDashboard() {
      try {
        const response = await fetch(`${WEB_APP_URL}?action=dashboard`);
        const data = await response.json();

        if (data.status === 'success') {
          actualizarBalance(data.balance_disponible);
          actualizarIngresos(data.ingresos);
          actualizarGastos(data.gastos);
          presupuestos = data.presupuestos || [];
          renderizarPresupuestos(presupuestos);
          renderizarMovimientos(data.movimientos_recientes || []);
        }
      } catch (error) {
        console.error('Error al cargar dashboard:', error);
        mostrarToast('Error al cargar datos', 'error');
      }
    }

    function actualizarBalance(valor) {
      document.getElementById('balance').textContent = formatearMoneda(valor);
    }

    function actualizarIngresos(valor) {
      document.getElementById('ingresos').textContent = formatearMoneda(valor);
    }

    function actualizarGastos(valor) {
      document.getElementById('gastos').textContent = formatearMoneda(valor);
    }

    function renderizarPresupuestos(lista) {
      const container = document.getElementById('presupuestos-container');

      if (!lista || lista.length === 0) {
        container.innerHTML = '<div class="card p-4 text-center text-secondary text-sm">Sin presupuestos configurados</div>';
        return;
      }

      container.innerHTML = lista.map(p => {
        const cat = CATEGORIAS[p.categoria] || CATEGORIAS.otro;
        const porcentaje = p.monto_limite > 0
          ? Math.min((p.monto_gastado / p.monto_limite) * 100, 100)
          : 0;
        const colorBarra = porcentaje >= 90 ? '#FF5252' : porcentaje >= 70 ? '#F59E0B' : '#00E699';

        return `
          <div class="card p-4">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-3">
                <span class="text-xl">${cat.emoji}</span>
                <div>
                  <p class="font-medium">${cat.nombre}</p>
                  <p class="text-secondary text-xs">${formatearMoneda(p.monto_gastado)} de ${formatearMoneda(p.monto_limite)}</p>
                </div>
              </div>
              <span class="text-sm font-semibold" style="color: ${colorBarra}">${porcentaje.toFixed(0)}%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${porcentaje}%; background-color: ${colorBarra}"></div>
            </div>
          </div>`;
      }).join('');
    }

    function renderizarMovimientos(lista) {
      const container = document.getElementById('movimientos-container');

      if (!lista || lista.length === 0) {
        container.innerHTML = '<p class="text-secondary text-sm text-center">Sin movimientos recientes</p>';
        return;
      }

      container.innerHTML = lista.map(m => {
        const cat = CATEGORIAS[m.categoria] || CATEGORIAS.otro;
        const esIngreso = m.tipo === 'Ingreso';
        const colorMonto = esIngreso ? 'text-emerald' : 'text-red-custom';
        const signo = esIngreso ? '+' : '-';
        const fecha = new Date(m.fecha);
        const fechaStr = formatearFecha(fecha);

        return `
          <div class="transaction-item">
            <div class="category-icon" style="background-color: ${cat.color}20; color: ${cat.color}">${cat.emoji}</div>
            <div class="flex-1 min-w-0">
              <p class="font-medium truncate">${m.etiqueta || m.nota || cat.nombre}</p>
              <p class="text-secondary text-xs">${fechaStr}</p>
            </div>
            <span class="font-semibold ${colorMonto}">${signo}${formatearMoneda(m.monto)}</span>
          </div>`;
      }).join('');
    }

    function openGastoModal() {
      const modal = document.getElementById('gasto-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('gasto-monto').focus();
      actualizarBarraPresupuesto();
    }

    function closeGastoModal() {
      const modal = document.getElementById('gasto-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.getElementById('gasto-form').reset();
      resetCategoryChips();
      document.getElementById('presupuesto-bar-container').classList.add('hidden');
    }

    function openIngresoModal() {
      const modal = document.getElementById('ingreso-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('ingreso-monto').focus();
    }

    function closeIngresoModal() {
      const modal = document.getElementById('ingreso-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.getElementById('ingreso-form').reset();
    }

    function openPresupuestoModal() {
      mostrarToast('Proximamente: configurar presupuestos', 'info');
    }

    function resetCategoryChips() {
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(c => c.classList.remove('active'));
      chips[0].classList.add('active');
      categoriaSeleccionada = 'alimentacion';
    }

    function actualizarBarraPresupuesto() {
      const container = document.getElementById('presupuesto-bar-container');
      const presupuesto = presupuestos.find(p =>
        p.categoria.toLowerCase() === categoriaSeleccionada.toLowerCase()
      );

      if (!presupuesto) {
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      const restante = presupuesto.restante;
      const limite = presupuesto.monto_limite;
      const porcentaje = limite > 0 ? Math.max((restante / limite) * 100, 0) : 0;
      const color = restante < 0 ? '#FF5252' : porcentaje < 20 ? '#F59E0B' : '#00E699';

      document.getElementById('presupuesto-restante-text').textContent = formatearMoneda(restante);
      document.getElementById('presupuesto-restante-text').style.color = color;

      const barra = document.getElementById('presupuesto-bar');
      barra.style.width = `${porcentaje}%`;
      barra.style.backgroundColor = color;
    }

    async function submitGasto(e) {
      e.preventDefault();

      const btn = document.getElementById('btn-submit-gasto');
      const textoOriginal = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;margin:0 auto"></div>';

      const payload = {
        action: 'gasto_rapido',
        monto: parseFloat(document.getElementById('gasto-monto').value),
        concepto: document.getElementById('gasto-concepto').value,
        categoria: categoriaSeleccionada,
        origen: 'web'
      };

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          mostrarToast('Gasto registrado', 'success');
          closeGastoModal();
          cargarDashboard();
        } else {
          mostrarToast(result.message || 'Error al registrar', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        mostrarToast('Error de conexion', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = textoOriginal;
      }
    }

    async function submitIngreso(e) {
      e.preventDefault();

      const btn = document.getElementById('btn-submit-ingreso');
      const textoOriginal = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;margin:0 auto"></div>';

      const payload = {
        action: 'ingreso_inteligente',
        monto: parseFloat(document.getElementById('ingreso-monto').value),
        fuente: document.getElementById('ingreso-fuente').value,
        origen: 'web'
      };

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          mostrarToast('Ingreso registrado', 'success');
          closeIngresoModal();
          cargarDashboard();
        } else {
          mostrarToast(result.message || 'Error al registrar', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        mostrarToast('Error de conexion', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = textoOriginal;
      }
    }

    function formatearMoneda(valor) {
      return new Intl.NumberFormat('es-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 2
      }).format(valor);
    }

    function formatearFecha(fecha) {
      const ahora = new Date();
      const diff = ahora - fecha;
      const minutos = Math.floor(diff / 60000);
      const horas = Math.floor(diff / 3600000);

      if (minutos < 1) return 'Ahora';
      if (minutos < 60) return `Hace ${minutos}m`;
      if (horas < 24) return `Hace ${horas}h`;

      return fecha.toLocaleDateString('es-ES', {
        day: 'numeric',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function mostrarToast(mensaje, tipo) {
      const toast = document.createElement('div');
      toast.className = `toast toast-${tipo}`;
      toast.textContent = mensaje;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
